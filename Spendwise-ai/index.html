
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Course Manager</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f3f6fb;
    color: #172b4d;
    font: 15px Arial, sans-serif;
  }
  header {
    background: #172b4d;
    color: white;
    padding: 24px max(20px, calc((100% - 1100px)/2));
  }
  header h1 { margin: 0 0 8px; }
  header p { margin: 0; color: #d5deeb; }
  main { max-width: 1100px; margin: 28px auto; padding: 0 18px; }
  .panel {
    background: white;
    padding: 22px;
    border: 1px solid #e1e8f0;
    border-radius: 12px;
    margin-bottom: 22px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  label { display: grid; gap: 7px; font-weight: 600; }
  input {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font: inherit;
  }
  input:focus { outline: 2px solid #93c5fd; }
  .wide { grid-column: 1 / -1; }
  button {
    border: 0;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 4px 4px 4px 0;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: 600;
  }
  button.secondary { background: #e8edf5; color: #172b4d; }
  button.danger { background: #b42318; }
  button:disabled { opacity: .6; cursor: wait; }
  .toolbar { margin-top: 18px; }
  #message { margin-top: 14px; overflow-wrap: anywhere; }
  .success { color: #067647; }
  .error { color: #b42318; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td {
    padding: 12px;
    border-bottom: 1px solid #e5eaf1;
    vertical-align: top;
  }
  th { background: #f8fafc; color: #64748b; font-size: 12px; }
  td a { color: #2563eb; overflow-wrap: anywhere; }
  .muted { font-size: 12px; color: #64748b; margin-top: 5px; }
  .hidden { display: none; }
  @media (max-width: 650px) {
    .grid { grid-template-columns: 1fr; }
    .wide { grid-column: auto; }
    .panel { padding: 15px; }
  }
</style>
</head>
<body>
<header>
  <h1>Course Manager</h1>
  <p>HTML + AWS API Gateway + Python Lambda + DynamoDB</p>
</header>

<main>
  <section class="panel">
    <h2 id="form-title">Create a course</h2>
    <form id="course-form">
      <input id="id" type="hidden">

      <div class="grid">
        <label>Course title *
          <input id="title" required maxlength="200"
                 placeholder="AWS Fundamentals">
        </label>
        <label>Author ID *
          <input id="authorId" required placeholder="author-1">
        </label>
        <label>Duration *
          <input id="length" required placeholder="2:30">
        </label>
        <label>Category *
          <input id="category" required placeholder="Cloud Computing">
        </label>
        <label class="wide">Course URL *
          <input id="watchHref" type="url" required
                 placeholder="https://example.com/course">
        </label>
      </div>

      <div class="toolbar">
        <button id="save" type="submit">Create course</button>
        <button id="cancel" class="secondary hidden" type="button">
          Cancel edit
        </button>
        <button id="refresh" class="secondary" type="button">
          Refresh courses
        </button>
      </div>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section class="panel">
    <h2>Courses <span id="count" class="muted"></span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Course</th>
            <th>Author</th>
            <th>Duration</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="courses">
          <tr><td colspan="5">Loading courses...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
  // IMPORTANT: include the stage in this URL if using a named API stage.
  const API_BASE_URL =
    "https://5pxvj1sz3j.execute-api.us-west-1.amazonaws.com/dev";

  const $ = id => document.getElementById(id);
  let courses = [];

  function message(text, type = "success") {
    $("message").textContent = text;
    $("message").className = type;
  }

  async function api(path, options = {}) {
    const response = await fetch(API_BASE_URL + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const text = await response.text();
    let data = null;

    if (text) {
      try { data = JSON.parse(text); }
      catch { data = { error: text }; }
    }

    if (!response.ok) {
      throw new Error(data?.error || `HTTP ${response.status}`);
    }

    return data;
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[char]);
  }

  function safeURL(value) {
    try {
      const url = new URL(value);
      return ["https:", "http:"].includes(url.protocol)
        ? escapeHTML(url.href) : "#";
    } catch { return "#"; }
  }

  async function loadCourses() {
    $("courses").innerHTML =
      '<tr><td colspan="5">Loading...</td></tr>';

    try {
      const result = await api("/courses");
      courses = Array.isArray(result) ? result : result.courses;

      if (!Array.isArray(courses)) {
        throw new Error("Expected an array of courses from the API.");
      }

      $("count").textContent = `(${courses.length})`;

      $("courses").innerHTML = courses.length
        ? courses.map(c => `
          <tr>
            <td>
              <strong>${escapeHTML(c.title)}</strong>
              <div class="muted">ID: ${escapeHTML(c.id)}</div>
              <a href="${safeURL(c.watchHref)}"
                 target="_blank" rel="noopener noreferrer">Open course</a>
            </td>
            <td>${escapeHTML(c.authorId)}</td>
            <td>${escapeHTML(c.length)}</td>
            <td>${escapeHTML(c.category)}</td>
            <td>
              <button data-action="edit" data-id="${escapeHTML(c.id)}">
                Edit
              </button>
              <button class="danger" data-action="delete"
                      data-id="${escapeHTML(c.id)}">Delete</button>
            </td>
          </tr>`).join("")
        : '<tr><td colspan="5">No courses found.</td></tr>';

      message("Courses loaded successfully.");
    } catch (error) {
      courses = [];
      $("count").textContent = "(unavailable)";
      $("courses").innerHTML =
        '<tr><td colspan="5">Could not load courses.</td></tr>';
      message(error.message, "error");
    }
  }

  function resetForm() {
    $("course-form").reset();
    $("id").value = "";
    $("form-title").textContent = "Create a course";
    $("save").textContent = "Create course";
    $("cancel").classList.add("hidden");
  }

  $("course-form").addEventListener("submit", async event => {
    event.preventDefault();

    const id = $("id").value;
    const payload = {
      title: $("title").value.trim(),
      authorId: $("authorId").value.trim(),
      length: $("length").value.trim(),
      category: $("category").value.trim(),
      watchHref: $("watchHref").value.trim()
    };

    $("save").disabled = true;

    try {
      await api(id ? `/courses/${encodeURIComponent(id)}` : "/courses", {
        method: id ? "PUT" : "POST",
        body: JSON.stringify(payload)
      });

      message(id ? "Course updated." : "Course created.");
      resetForm();
      await loadCourses();
    } catch (error) {
      message(error.message, "error");
    } finally {
      $("save").disabled = false;
    }
  });

  $("courses").addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const course = courses.find(c => String(c.id) === button.dataset.id);
    if (!course) return;

    const path = `/courses/${encodeURIComponent(course.id)}`;

    if (button.dataset.action === "edit") {
      $("id").value = course.id;
      $("title").value = course.title || "";
      $("authorId").value = course.authorId || "";
      $("length").value = course.length || "";
      $("category").value = course.category || "";
      $("watchHref").value = course.watchHref || "";
      $("form-title").textContent = "Edit course";
      $("save").textContent = "Save changes";
      $("cancel").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    if (button.dataset.action === "delete" &&
        confirm(`Delete "${course.title}" permanently?`)) {
      button.disabled = true;
      try {
        await api(path, { method: "DELETE" });
        message("Course deleted.");
        await loadCourses();
      } catch (error) {
        message(error.message, "error");
        button.disabled = false;
      }
    }
  });

  $("cancel").addEventListener("click", resetForm);
  $("refresh").addEventListener("click", loadCourses);

  loadCourses();
</script>
</body>
</html>
